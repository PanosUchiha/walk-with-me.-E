[Loot]
; The finder picks the richest chest, body or valuable item in view, kneels to search it, then waits.
; One find per area.
; Only one companion goes at a time: sFinder picks who (set it from the menu); empty = nearest companion.
bEnabled = true
fSearchRadius = 1000.000000
fLeaveDistance = 1500.000000
; A single item worth more than this turns the overhead chest gold. Septim piles count as a whole.
