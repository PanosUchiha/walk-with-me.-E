; Walk With Me 0.2.2. Settings save from the menu.
; Compatibility filenames and plugin identifiers retain Wayfarer.
[General]
bEnabled = true
; Opt in to automatic enrollment; otherwise add each companion explicitly.
bAutoDiscover = false
iEnrollmentVersion = 2
bRequirePlayerTeammate = true
iMaxFollowers = 10
iFormationMode = 0
iPreferredSide = 1

[HandHolding]
; classic = earlier procedural hand holding, no generated clasp clips required (default).
; tether = physics grip with locally generated OAR clasp clips.
sMethod = classic
; Experimental: hand/wrist twisting and awkward approach/turn animations remain.
; Third-person sticky hand holding. Walk/jog/run stay attached; sprint releases.
bEnabled = false
sPartner =
sPartnerName =
fLeadInSeconds = 1.0
fConnectDistance = 90.0
fReleaseDistance = 120.0
; Palm contact point in hand-local game units. The skeleton's hands are mirrored,
; so one triple describes the same surface point on both palms. Adjust if your
; body/hand meshes seat the clasp above, below or inside the palm surface.
fPalmX = 0.0
fPalmY = -2.35
fPalmZ = 5.0
; How close the two wrists must already be before the physics constraint is
; created. The constraint pulls the palms together the moment it exists, so a
; smaller value clasps more accurately and a larger one clasps more readily.
; Direct grip uses this limit immediately, without a gradual widening delay.
; While acquiring, the log prints "wrist=<measured>/<limit>" once a second.
fGripWristGap = 45.0

[Safety]
bReleaseInCombat = true
bReleaseWhenSneaking = true
bReleaseWhenWeaponDrawn = true
bReleaseWhenControlsDisabled = true
bRequireTravelPackage = true
bDisableIndoors = false
fReleaseDistance = 2500.0

